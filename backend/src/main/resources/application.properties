spring.application.name=alertas-backend
server.port=8080

# Conexion a Oracle Autonomous. Los valores NO van en Git: se leen de variables de entorno.
#   DB_ALIAS      alias del tnsnames.ora (ej. nombrebd_high)
#   DB_WALLET_DIR carpeta del wallet descomprimido, con barras normales (ej. C:/proyectos/wallet)
#   DB_USER / DB_PASSWORD  usuario de la aplicacion (no ADMIN)
spring.datasource.url=jdbc:oracle:thin:@${DB_ALIAS}?TNS_ADMIN=${DB_WALLET_DIR}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Pool chico: la base Autonomous gratuita tiene pocas conexiones disponibles.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JWT. La clave NO va en Git: se lee de la variable de entorno JWT_SECRET (minimo 32 caracteres).
jwt.secret=${JWT_SECRET:}
jwt.duracion-minutos=120
